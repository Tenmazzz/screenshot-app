services:
  vue:
    build:
      context: .
      dockerfile: docker/vue/Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8080:80"
    networks:
      - interne
 
  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    networks:
      - interne
    depends_on:
      - postgres
      - redis
      - minio
 
  laravel-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    env_file:
      - ./backend/.env
    command: php artisan queue:work --queue=broadcast_queue
    volumes:
      - ./backend:/var/www/html
    networks:
      - interne
    depends_on:
      - redis
      - laravel
 
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./worker:/app
    networks:
      - interne
    depends_on:
      - redis
 
  nginx:
    image: nginx:alpine
    ports:
      - "4242:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - interne
    depends_on:
      - laravel
      - vue
 
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - interne
 
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: screenshot_app
      POSTGRES_USER: screnshoot_user
      POSTGRES_PASSWORD: password123!
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - interne
 
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - interne
 
  soketi:
    image: quay.io/soketi/soketi:1.6.1-16-alpine
    environment:
      SOKETI_DEFAULT_APP_ID: screenshot_app_id
      SOKETI_DEFAULT_APP_KEY: screenshot_app_key
      SOKETI_DEFAULT_APP_SECRET: app-secret
      SOKETI_HOST: 0.0.0.0
    ports:
      - "6001:6001"
    networks:
      - interne
 
networks:
  interne:
    driver: bridge
 
volumes:
  pg_data:
  minio_data:
