services:
  vue:
    build:
      context: .
      dockerfile: docker/vue/Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    networks:
      - interne

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
    networks:
      - interne
    depends_on:
      - postgres
      - redis
      - minio

  redis:
    image: redis:7
    networks:
      - interne

  worker:
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    volumes:
      - ./worker:/app
    networks:
      - interne
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "4242:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - interne
    depends_on:
      - laravel
      - vue
    
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: screenshot_app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - interne

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    networks:
      - interne
  
  soketi:
    image: quay.io/soketi/soketi:1.6.1-16-alpine
    environment:
      SOKETI_DEFAULT_APP_ID: app-id
      SOKETI_DEFAULT_APP_KEY: app-key
      SOKETI_DEFAULT_APP_SECRET: app-secret
    ports:
      - '6001:6001'
    networks:
      - interne

  laravel-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --queue=broadcast_queue
    volumes:
      - ./backend:/var/www/html
    networks:
      - interne
    depends_on:
      - redis
      - laravel

networks:
  interne:
    driver: bridge

volumes:
  pg_data:
  minio_data: