stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - screenshot-runner
  script:
    - cd $CI_PROJECT_DIR
    - docker compose build

deploy:
  stage: deploy
  tags:
    - screenshot-runner
  script:
    - cd $CI_PROJECT_DIR
    - docker compose down
    - docker compose build --no-cache 
    - docker compose up -d
  when: manual
  only:
    - main