stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - screenshot-runner
  script:
    - cd $CI_PROJECT_DIR
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker compose -f docker-compose.prod.yml build
    
    - docker push $CI_REGISTRY_IMAGE/vue:$VERSION
    - docker tag $CI_REGISTRY_IMAGE/vue:$VERSION $CI_REGISTRY_IMAGE/vue:latest
    - docker push $CI_REGISTRY_IMAGE/vue:latest

    - docker push $CI_REGISTRY_IMAGE/laravel:$VERSION
    - docker tag $CI_REGISTRY_IMAGE/laravel:$VERSION $CI_REGISTRY_IMAGE/laravel:latest
    - docker push $CI_REGISTRY_IMAGE/laravel:latest

    - docker push $CI_REGISTRY_IMAGE/worker:$VERSION
    - docker tag $CI_REGISTRY_IMAGE/worker:$VERSION $CI_REGISTRY_IMAGE/worker:latest
    - docker push $CI_REGISTRY_IMAGE/worker:latest

    - docker push $CI_REGISTRY_IMAGE/nginx:$VERSION
    - docker tag $CI_REGISTRY_IMAGE/nginx:$VERSION $CI_REGISTRY_IMAGE/nginx:latest
    - docker push $CI_REGISTRY_IMAGE/nginx:latest

    - docker image prune -f
  only:
    - main

deploy:
  stage: deploy
  tags:
    - screenshot-runner
  script:
    - cd $CI_PROJECT_DIR
    - envsubst < backend/.env.production > backend/.env
    - docker compose -f docker-compose.prod.yml down
    - docker compose -f docker-compose.prod.yml up -d
  when: manual
  only:
    - main