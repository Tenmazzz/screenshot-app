stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - screenshot-runner
  script:
    - cd $CI_PROJECT_DIR
    - docker compose build --no-cache

deploy:
  stage: deploy
  tags:
    - screenshot-runner
  script:
    - $CI_PROJECT_DIR
    - docker compose down
    - envsubst < backend/.env.production > backend/.env
    - docker compose up -d
  when: manual
  only:
    - main