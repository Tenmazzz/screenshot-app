stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - screenshot-runner
  script:
    - cd $CI_PROJECT_DIR
    - envsubst < backend/.env.production > backend/.env
    - docker compose -f docker-compose.prod.yml build --no-cache
  only:
    - main

deploy:
  stage: deploy
  tags:
    - screenshot-runner
  script:
    - cd $CI_PROJECT_DIR
    - envsubst < backend/.env.production > backend/.env
    - docker compose -f docker-compose.prod.yml down
    - docker compose -f docker-compose.prod.yml up -d
  when: manual
  only:
    - main