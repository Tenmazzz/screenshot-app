services:
  vue:
    build:
      context: .
      dockerfile: docker/vue/Dockerfile
    image: ${CI_REGISTRY_IMAGE}/vue:${CI_COMMIT_SHORT_SHA}
    restart: always
    networks:
      - interne
 
  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    env_file: 
      - ./backend/.env
    image: ${CI_REGISTRY_IMAGE}/laravel:${CI_COMMIT_SHORT_SHA}
    restart: always
    networks:
      - interne
    depends_on:
      - postgres
      - redis
      - minio
 
  laravel-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    env_file:
      - ./backend/.env
    image: ${CI_REGISTRY_IMAGE}/laravel:${CI_COMMIT_SHORT_SHA}
    command: php artisan queue:work --queue=broadcast_queue
    restart: always
    networks:
      - interne
    depends_on:
      - redis
      - laravel
 
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: ${CI_REGISTRY_IMAGE}/worker:${CI_COMMIT_SHORT_SHA}
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    networks:
      - interne
    depends_on:
      - redis
 
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: $CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_SHORT_SHA
    restart: always
    ports:
      - "4242:80"
    networks:
      - interne
    depends_on:
      - laravel
      - vue
 
  redis:
    image: redis:7
    restart: always
    networks:
      - interne
 
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: screenshot_app
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - interne
 
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    networks:
      - interne
 
  soketi:
    image: quay.io/soketi/soketi:1.6.1-16-alpine
    restart: always
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
      SOKETI_HOST: 0.0.0.0
    ports:
      - "6001:6001"
    networks:
      - interne
 
networks:
  interne:
    driver: bridge
 
volumes:
  pg_data:
  minio_data:
